<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="4" y="8" width="56" height="48" rx="6" fill="url(#bg)" stroke="#2dd4bf" stroke-width="1.5"/>
  <!-- Terminal header -->
  <rect x="4" y="8" width="56" height="12" rx="6" fill="#2dd4bf" opacity="0.15"/>
  <circle cx="12" cy="14" r="2.5" fill="#f87171"/>
  <circle cx="20" cy="14" r="2.5" fill="#fbbf24"/>
  <circle cx="28" cy="14" r="2.5" fill="#4ade80"/>
  <!-- Prompt symbol -->
  <text x="12" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#2dd4bf">&gt;_</text>
  <!-- Clean sweep line -->
  <line x1="28" y1="32" x2="52" y2="32" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="38" x2="44" y2="38" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="44" x2="48" y2="44" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- X mark for clear -->
  <circle cx="52" cy="44" r="8" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <line x1="48" y1="40" x2="56" y2="48" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="40" x2="48" y2="48" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
</svg>