<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="4" y="8" width="56" height="48" rx="6" fill="url(#bg)" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- Brain outline -->
  <path d="M32 14 C20 14, 12 22, 12 32 C12 42, 20 50, 32 50 C44 50, 52 42, 52 32 C52 22, 44 14, 32 14Z"
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4"/>
  <!-- Brain folds -->
  <path d="M22 24 Q28 28, 24 36" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 20 Q38 26, 36 34" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 28 Q44 34, 40 42" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Lightning bolt -->
  <path d="M32 18 L38 30 L34 30 L40 46 L28 34 L32 34 Z"
        fill="url(#bolt)" stroke="#fbbf24" stroke-width="1"/>
  <!-- Speed lines -->
  <line x1="20" y1="20" x2="24" y2="20" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="18" y1="26" x2="22" y2="26" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="44" y1="38" x2="48" y2="38" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="42" y1="44" x2="46" y2="44" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
</svg>