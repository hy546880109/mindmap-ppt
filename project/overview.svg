<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="4" width="60" height="56" rx="8" fill="url(#bg)" stroke="#2dd4bf" stroke-width="1.5"/>
  <!-- Terminal header bar -->
  <rect x="2" y="4" width="60" height="14" rx="8" fill="#1e293b"/>
  <rect x="2" y="14" width="60" height="4" fill="#1e293b"/>
  <!-- Window controls -->
  <circle cx="12" cy="11" r="3" fill="#f87171"/>
  <circle cx="20" cy="11" r="3" fill="#fbbf24"/>
  <circle cx="28" cy="11" r="3" fill="#4ade80"/>
  <!-- Title text -->
  <text x="48" y="14" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">claude-code</text>
  <!-- Command prompt lines -->
  <text x="10" y="30" font-family="monospace" font-size="8" fill="#2dd4bf">&gt;_</text>
  <rect x="24" y="24" width="28" height="3" rx="1" fill="#2dd4bf" opacity="0.8"/>
  <rect x="24" y="31" width="20" height="3" rx="1" fill="#60a5fa" opacity="0.6"/>
  <rect x="24" y="38" width="24" height="3" rx="1" fill="#a78bfa" opacity="0.6"/>
  <rect x="24" y="45" width="16" height="3" rx="1" fill="#f472b6" opacity="0.6"/>
  <!-- Cursor -->
  <rect x="36" y="45" width="3" height="4" fill="#2dd4bf" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Decorative elements -->
  <circle cx="54" cy="34" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="50" cy="50" r="1.5" fill="#4ade80" opacity="0.4"/>
</svg>