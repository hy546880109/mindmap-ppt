<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="4" width="60" height="56" rx="8" fill="url(#bg)" stroke="#2dd4bf" stroke-width="1.5"/>
  <!-- CC logo stylized -->
  <text x="32" y="28" font-family="monospace" font-size="16" font-weight="bold" fill="url(#text)" text-anchor="middle">CC</text>
  <!-- Subtitle -->
  <text x="32" y="40" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">tips</text>
  <!-- Decorative lines -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <line x1="18" y1="52" x2="46" y2="52" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Corner accent -->
  <circle cx="54" cy="10" r="4" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.5"/>
  <circle cx="10" cy="54" r="3" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
</svg>