<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" style="background:#faf8f5">
  <rect width="1280" height="800" fill="#faf8f5"/>
  <rect x="80" y="60" width="1120" height="100" rx="12" fill="#183a4a"/>
  <text x="110" y="120" font-family="system-ui,sans-serif" font-size="32" fill="#fffdf8" font-weight="bold">实战技巧与最佳实践</text>

  <rect x="80" y="180" width="560" height="260" rx="12" fill="#eef7f3" stroke="#183a4a" stroke-width="2"/>
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="22" fill="#183a4a" font-weight="bold">开发流程</text>
  <rect x="110" y="270" width="100" height="60" rx="8" fill="#183a4a"/>
  <text x="125" y="305" font-family="monospace" font-size="14" fill="#d8894f">/plan</text>
  <text x="235" y="300" font-family="system-ui,sans-serif" font-size="20" fill="#666">→</text>
  <rect x="270" y="270" width="100" height="60" rx="8" fill="#183a4a"/>
  <text x="280" y="305" font-family="monospace" font-size="14" fill="#d8894f">@文件</text>
  <text x="395" y="300" font-family="system-ui,sans-serif" font-size="20" fill="#666">→</text>
  <rect x="430" y="270" width="100" height="60" rx="8" fill="#183a4a"/>
  <text x="445" y="305" font-family="monospace" font-size="14" fill="#d8894f">!测试</text>
  <text x="555" y="300" font-family="system-ui,sans-serif" font-size="20" fill="#666">→</text>
  <rect x="590" y="270" width="100" height="60" rx="8" fill="#d8894f"/>
  <text x="600" y="305" font-family="monospace" font-size="14" fill="#fffdf8">@日志</text>
  <text x="110" y="380" font-family="system-ui,sans-serif" font-size="16" fill="#666">规划 → 编码 → 测试 → 调试</text>

  <rect x="660" y="180" width="540" height="260" rx="12" fill="#fffdf8" stroke="#183a4a" stroke-width="2"/>
  <text x="690" y="230" font-family="system-ui,sans-serif" font-size="22" fill="#183a4a" font-weight="bold">效率技巧</text>
  <rect x="690" y="270" width="220" height="80" rx="8" fill="#183a4a"/>
  <text x="720" y="305" font-family="system-ui,sans-serif" font-size="14" fill="#d8894f">组合使用符号</text>
  <rect x="930" y="270" width="220" height="80" rx="8" fill="#183a4a"/>
  <text x="960" y="305" font-family="system-ui,sans-serif" font-size="14" fill="#d8894f">后台任务管理</text>
  <rect x="690" y="370" width="220" height="60" rx="8" fill="#183a4a"/>
  <text x="720" y="405" font-family="system-ui,sans-serif" font-size="14" fill="#d8894f">历史命令复用</text>

  <rect x="80" y="460" width="1120" height="280" rx="12" fill="#d8894f"/>
  <text x="120" y="520" font-family="system-ui,sans-serif" font-size="22" fill="#fffdf8" font-weight="bold">常见问题</text>
  <rect x="120" y="550" width="340" height="100" rx="8" fill="#fffdf8"/>
  <text x="140" y="590" font-family="system-ui,sans-serif" font-size="14" fill="#183a4a" font-weight="bold">Q: 符号不生效？</text>
  <text x="140" y="620" font-family="system-ui,sans-serif" font-size="12" fill="#666">检查模式：/命令 @引用 !执行</text>

  <rect x="480" y="550" width="340" height="100" rx="8" fill="#fffdf8"/>
  <text x="500" y="590" font-family="system-ui,sans-serif" font-size="14" fill="#183a4a" font-weight="bold">Q: 模式冲突？</text>
  <text x="500" y="620" font-family="system-ui,sans-serif" font-size="12" fill="#666">/config 检查配置</text>

  <rect x="840" y="550" width="340" height="100" rx="8" fill="#fffdf8"/>
  <text x="860" y="590" font-family="system-ui,sans-serif" font-size="14" fill="#183a4a" font-weight="bold">Q: 任务管理混乱？</text>
  <text x="860" y="620" font-family="system-ui,sans-serif" font-size="12" fill="#666">/tasks 查看 /clear 清理</text>
</svg>